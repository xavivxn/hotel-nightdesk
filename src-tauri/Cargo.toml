[package]
name = "nightdesk"
version = "0.1.0"
description = "Sistema local de recepción para hotel y motel"
authors = ["Nightdesk"]
edition = "2021"

[lib]
name = "nightdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"

