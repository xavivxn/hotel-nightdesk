<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nightdesk</title>
    <script>
      (function () {
        var theme = localStorage.getItem("nightdesk.theme");
        if (theme === "light") {
          document.documentElement.classList.remove("dark");
          document.documentElement.style.colorScheme = "light";
        } else {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: grid;
        place-items: center;
      }
      .boot-splash {
        background: #0e1012;
        color: #a39b8f;
        font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      }
      html:not(.dark) .boot-splash {
        background: #f4f3ef;
        color: #5c574e;
      }
      .boot-wordmark {
        margin: 0;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.22em;
        color: #2dd4bf;
      }
      html:not(.dark) .boot-wordmark {
        color: #0f766e;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="boot-splash" class="boot-splash" aria-live="polite">
      <div class="boot-splash-inner">
        <p class="boot-wordmark">NIGHTDESK</p>
        <p class="boot-kicker">Abriendo recepción</p>
        <div class="boot-cells" aria-hidden="true">
          <span class="boot-cell"><span class="boot-cell-core"></span></span>
          <span class="boot-cell"><span class="boot-cell-core"></span></span>
          <span class="boot-cell"><span class="boot-cell-core"></span></span>
          <span class="boot-cell"><span class="boot-cell-core"></span></span>
        </div>
        <div class="boot-rail" aria-hidden="true"><span class="boot-rail-fill"></span></div>
        <p class="boot-meta">SQLite · PIN · tablero</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
